[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inferscale"
version = "0.3.0"
description = "Reproducible, quality-aware LLM inference benchmarking"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "sqlalchemy>=2.0,<3", "prometheus-client>=0.21,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
distributed = ["ray[default]>=2.40,<3"]
search = ["scikit-learn>=1.5,<2"]
telemetry = ["psutil>=6,<8", "opentelemetry-instrumentation-fastapi", "opentelemetry-exporter-otlp-proto-http"]
tokenizer = ["transformers>=4.46,<6"]
openeval = ["openeval @ git+https://github.com/Harshrudrawar/OpenEval.git@a81e15d35cefcaf42b1e01a10e82f43722e6c662"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
inferscale = "inferscale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
