{{- if .Values.inference.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-inference
spec:
  replicas: {{ .Values.inference.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: "{{ .Release.Name }}-inference"}
  template:
    metadata:
      labels: {app: "{{ .Release.Name }}-inference"}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {{ .Values.inference.nodeSelector | toJson }}
      tolerations: {{ .Values.inference.tolerations | toJson }}
      containers:
        - name: vllm
          image: {{ .Values.inference.image | quote }}
          args:
            - --model
            - {{ .Values.inference.model | quote }}
            - --tensor-parallel-size
            - {{ .Values.inference.tensorParallel | quote }}
            - --max-model-len
            - {{ .Values.inference.maxModelLen | quote }}
            - --max-num-seqs
            - {{ .Values.inference.maxNumSeqs | quote }}
            {{- if .Values.inference.revision }}
            - --revision
            - {{ .Values.inference.revision | quote }}
            {{- end }}
            {{- if .Values.inference.quantization }}
            - --quantization
            - {{ .Values.inference.quantization | quote }}
            {{- end }}
          ports: [{containerPort: 8000, name: http}]
          resources:
            requests: {cpu: '2', memory: 8Gi, nvidia.com/gpu: {{ .Values.inference.tensorParallel }}}
            limits: {cpu: '8', memory: 32Gi, nvidia.com/gpu: {{ .Values.inference.tensorParallel }}}
          startupProbe: {httpGet: {path: /health, port: http}, failureThreshold: 120, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          volumeMounts: [{name: shm, mountPath: /dev/shm}]
      volumes:
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 4Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-inference
spec:
  selector: {app: "{{ .Release.Name }}-inference"}
  ports: [{port: 8000, targetPort: http, name: http}]
{{- if .Values.inference.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-inference
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: '{{ .Release.Name }}-inference'}
  minReplicas: {{ .Values.inference.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.inference.autoscaling.maxReplicas }}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
    scaleUp: {stabilizationWindowSeconds: 30}
  metrics:
    - type: Pods
      pods:
        metric: {name: vllm_queue_depth}
        target: {type: AverageValue, averageValue: {{ .Values.inference.autoscaling.targetQueueDepth | quote }}}
{{- end }}
{{- end }}
