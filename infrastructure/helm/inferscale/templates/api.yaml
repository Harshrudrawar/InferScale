apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app: "{{ .Release.Name }}-api"}
  template:
    metadata:
      labels: {app: "{{ .Release.Name }}-api"}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{containerPort: 8000, name: http}]
          envFrom: [{secretRef: {name: {{ .Values.existingSecret }}}}]
          env:
            - {name: INFERSCALE_EMBEDDED_WORKER, value: '0'}
            - {name: INFERSCALE_MODELS, value: /config/models.json}
          resources: {{ .Values.resources | toJson }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: registry, mountPath: /config, readOnly: true}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 20}
      volumes:
        - name: registry
          configMap: {name: "{{ .Release.Name }}-registry"}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector: {app: "{{ .Release.Name }}-api"}
  ports: [{port: 8000, targetPort: http, name: http}]
