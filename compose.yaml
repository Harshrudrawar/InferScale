services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      INFERSCALE_EMBEDDED_WORKER: '0'
      INFERSCALE_DATABASE_URL: postgresql+psycopg://inferscale:local_dev_only@postgres:5432/inferscale
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    build: .
    command: ["inferscale", "worker"]
    environment:
      INFERSCALE_DATABASE_URL: postgresql+psycopg://inferscale:local_dev_only@postgres:5432/inferscale
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  migrate:
    build: .
    command: ["inferscale", "migrate"]
    environment:
      INFERSCALE_DATABASE_URL: postgresql+psycopg://inferscale:local_dev_only@postgres:5432/inferscale
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: inferscale
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: inferscale
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inferscale"]
      interval: 5s
      timeout: 3s
      retries: 10
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-local_dev_only}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
volumes:
  postgres_data:
  grafana_data:
